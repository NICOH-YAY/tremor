name: Midterm nicoh-yay
on:
  pull_request:
    paths:
      - 'midterms/nicoh-yay/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: midterms/nicoh-yay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: midterms/nicoh-yay/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
